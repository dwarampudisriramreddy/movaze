name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Android signing
        run: |
          cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      # Export the public upload certificate from the committed keystore.
      # Upload this PEM to Play Console -> App signing -> Upload key certificate.
      - name: Export upload certificate
        run: |
          keytool -export -rfc \
            -keystore android/app/upload-keystore.jks \
            -alias upload \
            -storepass android \
            -file android/app/upload_certificate.pem

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Release AAB
        run: flutter build appbundle --release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            android/app/upload-keystore.jks
            android/app/upload_certificate.pem
          if-no-files-found: error
